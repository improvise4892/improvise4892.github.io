<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weight & Calorie Tracker</title>
  <!-- Chart.js and Zoom Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hammerjs/2.0.8/hammer.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-zoom/2.0.1/chartjs-plugin-zoom.min.js"></script>
  
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; }
    input, button { width: 100%; padding: 10px; margin: 6px 0; box-sizing: border-box; }
    .card { background: #f9f9f9; padding: 15px; margin-top: 15px; border-radius: 8px; border: 1px solid #ddd; }
    .chart-container { position: relative; width: 100%; margin-top: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    th { background: #f1f1f1; }
    button.delete-btn { background: #ff4d4d; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; width: auto; }
    button.delete-btn:hover { background: #cc0000; }
    button.secondary-btn { background: #6c757d; color: white; border: none; margin-top: 5px; cursor: pointer; }
    button.secondary-btn:hover { background: #5a6268; }
    button.primary-btn { background: #007bff; color: white; border: none; cursor: pointer; }
    button.primary-btn:hover { background: #0056b3; }
    button.danger-outline { background: white; color: #cc0000; border: 1px solid #cc0000; margin-top: 8px; cursor: pointer; }
    button.danger-outline:hover { background: #fff0f0; }
    #importStatus { font-size: 14px; margin-top: 8px; font-weight: bold; padding: 6px; border-radius: 4px; display: none; }
  </style>
</head>
<body>
  <h2>Weight & Calorie Tracker</h2>

  <!-- CSV Import Box -->
  <div class="card" style="background: #f0f7ff;">
    <h3 style="margin-top:0;">Import Renpho CSV</h3>
    <input type="file" id="csvFile" accept=".csv">
    <button class="primary-btn" onclick="handleImportClick()">Import Selected CSV</button>
    <div id="importStatus"></div>
    <button class="danger-outline" onclick="clearAllData()">Clear All Stored Entries</button>
  </div>
  
  <label>Date:</label>
  <input type="date" id="date">
  
  <label>Weight (lbs):</label>
  <input type="number" step="0.1" id="weight" placeholder="e.g., 150">
  
  <label>Calories Consumed (optional):</label>
  <input type="number" id="calories" placeholder="Defaults to 2200 if blank">
